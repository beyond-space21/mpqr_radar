<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mpqr radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <p class="brand-name">mpqr</p>
      <p class="brand-sub">radar flow monitor</p>
    </div>
    <div class="live">
      <span id="dot" class="dot"></span>
      <span id="conn">connecting</span>
    </div>
  </header>

  <main>
    <section class="hero-status">
      <p class="label">device status</p>
      <p id="status" class="status-value">—</p>
      <p id="status-meta" class="meta">waiting for MQTT…</p>
    </section>

    <section class="metrics" aria-label="Latest readings">
      <div class="metric">
        <p class="label">water level</p>
        <p class="value"><span id="lvl">—</span><span class="unit">mm</span></p>
      </div>
      <div class="metric">
        <p class="label">velocity</p>
        <p class="value"><span id="vel">—</span><span class="unit">m/s</span></p>
      </div>
      <div class="metric">
        <p class="label">instant flow</p>
        <p class="value"><span id="flow">—</span><span class="unit">m³/s</span></p>
      </div>
      <div class="metric">
        <p class="label">volume</p>
        <p class="value"><span id="vol">—</span><span class="unit">m³</span></p>
      </div>
      <div class="metric">
        <p class="label">empty height</p>
        <p class="value"><span id="empty">—</span><span class="unit">mm</span></p>
      </div>
      <div class="metric">
        <p class="label">direction</p>
        <p class="value"><span id="dir">—</span></p>
      </div>
    </section>

    <section class="chart-wrap">
      <div class="chart-head">
        <p class="label">level history</p>
        <p id="msg-count" class="meta">0 messages</p>
      </div>
      <canvas id="chart" width="960" height="220"></canvas>
    </section>

    <section class="conns-wrap">
      <div class="chart-head">
        <p class="label">broker connections</p>
        <p id="conn-count" class="meta">0 clients</p>
      </div>
      <ul id="conns" class="conns"></ul>
    </section>
  </main>

  <footer>
    <p>MQTT <code id="broker">—</code> · topics <code>mpqr/radar/01/*</code></p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
