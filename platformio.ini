; PlatformIO Project Configuration File
; Arduino Nano + SIM7600G-H + RS-RAD-N01-3 radar flow-meter
;
; Upload tips if stk500_getsync fails:
;   1) Disconnect anything on D0/D1 (and power SIM7600 off) during upload
;   2) Try env:nanoatmega328 (old bootloader @ 57600)
;   3) Press Nano RESET the moment upload starts if using a bare FTDI cable

[platformio]
default_envs = nanoatmega328new

[common]
platform = atmelavr
framework = arduino
monitor_speed = 115200
build_flags =
	-DTINY_GSM_MODEM_SIM7600
	-DTINY_GSM_RX_BUFFER=256
	-DMQTT_MAX_PACKET_SIZE=256
	-DARDUINO_MQTT_CLIENT_TIMEOUT=15000
lib_deps =
	vshymanskyy/TinyGSM@^0.12.0
	knolleary/PubSubClient@^2.8
lib_ignore =
	Ethernet
	WiFi
	WiFiClientSecure
	Adafruit SleepyDog Library

; New bootloader — upload @ 115200 (default)
[env:nanoatmega328new]
extends = common
board = nanoatmega328new
upload_speed = 115200

; Old bootloader (many clones / older FTDI Nanos) — upload @ 57600
[env:nanoatmega328]
extends = common
board = nanoatmega328
upload_speed = 57600
